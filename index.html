<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitalwounds Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #F8F9FA; }
        .glass-card { background: white; border-radius: 1.5rem; box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
        .tab-active { border-bottom: 2px solid #3B82F6; color: #3B82F6; }
    </style>
</head>
<body class="p-4 flex flex-col items-center justify-center min-h-screen">
    <main class="w-full max-w-lg">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-gray-900 mb-2">Vitalwounds <span class="text-blue-500">Downloader</span></h1>
            <p class="text-gray-500">Download YouTube & Sosmed Instan</p>
        </header>

        <div class="glass-card p-6">
            <div class="flex gap-2 mb-4">
                <input type="text" id="urlInput" placeholder="Tempel link video..." class="flex-1 p-3 rounded-xl border border-gray-200 outline-none focus:ring-2 focus:ring-blue-500">
                <button id="downloadBtn" class="px-6 py-3 bg-blue-500 text-white font-bold rounded-xl hover:bg-blue-600 transition">Cari</button>
            </div>
            
            <div id="resultArea" class="hidden">
                <div class="flex gap-4 items-center mb-6">
                    <img id="thumb" class="w-24 h-24 rounded-lg object-cover bg-gray-200" src="">
                    <h3 id="vidTitle" class="font-bold text-gray-800 line-clamp-2"></h3>
                </div>

                <div class="flex gap-4 border-b border-gray-200 mb-4">
                    <button onclick="showTab('video')" id="tabV" class="tab-active py-2 font-bold">Video (MP4)</button>
                    <button onclick="showTab('audio')" id="tabA" class="py-2 font-bold text-gray-400">Audio (MP3)</button>
                </div>

                <div id="videoList" class="grid grid-cols-2 gap-2"></div>
                <div id="audioList" class="hidden grid grid-cols-2 gap-2"></div>
            </div>
        </div>
    </main>

    <script>
        let currentData = null;
        async function fetchMedia() {
            const url = document.getElementById('urlInput').value.trim();
            if(!url) return;
            document.getElementById('downloadBtn').innerText = "Memproses...";
            try {
                const res = await fetch('https://dl.vitalwounds.my.id/api/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });
                currentData = await res.json();
                render();
            } catch(e) { alert("Error koneksi"); }
            document.getElementById('downloadBtn').innerText = "Cari";
        }

        function render() {
            document.getElementById('resultArea').classList.remove('hidden');
            document.getElementById('thumb').src = currentData.thumbnail;
            document.getElementById('vidTitle').innerText = currentData.title;
            
            const vList = document.getElementById('videoList');
            const aList = document.getElementById('audioList');
            vList.innerHTML = ''; aList.innerHTML = '';

            currentData.videos.forEach(v => vList.innerHTML += `<a href="${v.url}" target="_blank" class="p-2 text-center text-xs font-bold bg-gray-100 rounded-lg">${v.label}</a>`);
            currentData.audios.forEach(a => aList.innerHTML += `<a href="${a.url}" target="_blank" class="p-2 text-center text-xs font-bold bg-gray-100 rounded-lg">${a.label}</a>`);
        }

        function showTab(type) {
            document.getElementById('videoList').classList.toggle('hidden', type !== 'video');
            document.getElementById('audioList').classList.toggle('hidden', type !== 'audio');
            document.getElementById('tabV').className = type === 'video' ? 'tab-active py-2 font-bold' : 'py-2 font-bold text-gray-400';
            document.getElementById('tabA').className = type === 'audio' ? 'tab-active py-2 font-bold' : 'py-2 font-bold text-gray-400';
        }

        document.getElementById('downloadBtn').addEventListener('click', fetchMedia);
    </script>
</body>
</html>
