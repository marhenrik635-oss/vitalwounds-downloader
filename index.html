<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitalwounds Downloader — All-in-One Social Media Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --vw-bg: #F8F9FA; --vw-surface: #FFFFFF; --vw-text: #1A1A2E; --vw-accent: #3B82F6; }
        body { font-family: 'Outfit', sans-serif; background-color: var(--vw-bg); color: var(--vw-text); }
        .glass-card { background: var(--vw-surface); border: 1px solid rgba(0,0,0,0.08); border-radius: 1.5rem; }
    </style>
</head>
<body class="p-4 flex flex-col items-center justify-center min-h-screen">
    <main class="w-full max-w-2xl">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-extrabold mb-2">Vitalwounds <span class="text-vw-accent">Downloader</span></h1>
            <p class="text-gray-500 font-medium">Backend Server: VPS Pro</p>
        </header>

        <div class="glass-card p-6">
            <input type="text" id="urlInput" placeholder="Tempel link video..." class="w-full p-4 rounded-xl border border-gray-200 mb-4 focus:ring-2 focus:ring-vw-accent outline-none">
            <button id="downloadBtn" class="w-full py-4 bg-vw-accent text-white font-bold rounded-xl hover:bg-blue-600 transition">Download Sekarang</button>
            <div id="status" class="mt-4 text-center text-sm font-bold text-gray-500"></div>
        </div>
    </main>
    <script>
        document.getElementById('downloadBtn').addEventListener('click', async () => {
            const url = document.getElementById('urlInput').value;
            const status = document.getElementById('status');
            status.innerText = "Memproses...";
            
            try {
                const response = await fetch('https://dl.vitalwounds.my.id/api/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });
                const data = await response.json();
                if(data.url) {
                    window.open(data.url, '_blank');
                    status.innerText = "Berhasil!";
                } else {
                    status.innerText = "Error: " + data.error;
                }
            } catch(e) {
                status.innerText = "Error koneksi ke backend.";
            }
        });
    </script>
</body>
</html>
