<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitalwounds Downloader — All-in-One Social Media Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --vw-bg: #F8F9FA; --vw-surface: #FFFFFF; --vw-text: #1A1A2E; --vw-accent: #3B82F6; }
        body { font-family: 'Outfit', sans-serif; background-color: var(--vw-bg); color: var(--vw-text); }
        .glass-card { background: var(--vw-surface); border: 1px solid rgba(0,0,0,0.08); border-radius: 1.5rem; }
    </style>
</head>
<body class="p-4 flex flex-col items-center">
    <main class="w-full max-w-2xl">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-extrabold mb-2">Vitalwounds <span class="text-vw-accent">Downloader</span></h1>
            <p class="text-gray-500 font-medium">Tempel link, pilih platform, download.</p>
        </header>

        <section class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-8">
            <!-- Tombol Social Media -->
            <button onclick="setPlaceholder('YouTube')" class="p-3 rounded-xl bg-white border border-gray-200 hover:border-vw-accent flex flex-col items-center gap-2 transition">
                <img src="https://upload.wikimedia.org/wikipedia/commons/4/42/YouTube_icon_%282013-2017%29.png" class="w-8 h-8 object-contain">
                <span class="text-xs font-bold">YouTube</span>
            </button>
            <button onclick="setPlaceholder('TikTok')" class="p-3 rounded-xl bg-white border border-gray-200 hover:border-vw-accent flex flex-col items-center gap-2 transition">
                <img src="https://upload.wikimedia.org/wikipedia/en/a/a9/TikTok_logo.svg" class="w-8 h-8 object-contain">
                <span class="text-xs font-bold">TikTok</span>
            </button>
            <button onclick="setPlaceholder('Instagram')" class="p-3 rounded-xl bg-white border border-gray-200 hover:border-vw-accent flex flex-col items-center gap-2 transition">
                <img src="https://upload.wikimedia.org/wikipedia/commons/e/e7/Instagram_logo_2016.svg" class="w-8 h-8">
                <span class="text-xs font-bold">Instagram</span>
            </button>
            <button onclick="setPlaceholder('Facebook')" class="p-3 rounded-xl bg-white border border-gray-200 hover:border-vw-accent flex flex-col items-center gap-2 transition">
                <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/2021_Facebook_icon.svg" class="w-8 h-8">
                <span class="text-xs font-bold">Facebook</span>
            </button>
        </section>

        <div class="glass-card p-6">
            <input type="text" id="urlInput" placeholder="Pilih platform dulu..." class="w-full p-4 rounded-xl border border-gray-200 mb-4 focus:ring-2 focus:ring-vw-accent outline-none">
            <button id="downloadBtn" class="w-full py-4 bg-vw-accent text-white font-bold rounded-xl hover:bg-blue-600 transition">Download Sekarang</button>
        </div>
    </main>
    <script>
        const input = document.getElementById('urlInput');
        function setPlaceholder(platform) { input.placeholder = `Tempel link ${platform} di sini...`; input.focus(); }
        // Fetch logic here...
    </script>
</body>
</html>
